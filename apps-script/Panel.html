<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{ --black:#0B0B0B; --cream:#F5F3EF; --paper:#FBFAF7; --sand:#E9E3D9; --taupe:#B5A48A; --taupe-deep:#8A7A63; --muted:#5F5850; --line:rgba(11,11,11,.12); --ok:#3a6b35; --bad:#9b2c2c; --warn:#8a6a1f; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ overflow-x:hidden; }
  body{ font-family:Montserrat, Arial, sans-serif; font-size:14px; color:var(--black); background:var(--cream); }
  header{ background:var(--black); color:var(--cream); padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  .logo{ font-family:'Playfair Display', Georgia, serif; font-size:22px; letter-spacing:.08em; }
  .logo small{ display:block; font-family:Montserrat; font-size:9px; letter-spacing:.3em; color:var(--taupe); }
  .der{ display:flex; align-items:center; gap:10px; }
  #sync{ font-size:11px; color:var(--taupe); }
  #sync.guardando{ color:#f0d9a0; }
  header button{ background:transparent; color:var(--cream); border:1px solid rgba(245,243,239,.4); padding:9px 12px; font:inherit; font-size:11px; letter-spacing:.15em; text-transform:uppercase; cursor:pointer; }
  main{ max-width:1200px; margin:0 auto; padding:16px 12px 60px; }
  .tabs{ display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .tab{ flex:none; border:1px solid var(--line); background:#fff; padding:10px 12px; font:inherit; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .tab.activa{ background:var(--black); color:var(--cream); border-color:var(--black); }
  .tab span{ display:inline-block; min-width:20px; margin-left:6px; padding:1px 6px; border-radius:20px; background:var(--sand); color:var(--black); font-size:11px; text-align:center; }
  .tab.activa span{ background:var(--taupe); }
  .card{ background:#fff; border:1px solid var(--line); padding:16px; margin-bottom:12px; }
  .card.resaltada{ outline:2px solid var(--taupe); }
  .card h3{ font-family:'Playfair Display', Georgia, serif; font-weight:400; font-size:20px; margin-bottom:4px; }
  .meta{ color:var(--muted); font-size:12px; margin-bottom:12px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:8px 18px; margin-bottom:14px; }
  .grid div{ min-width:0; overflow-wrap:anywhere; }
  .grid div span{ display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--taupe-deep); }
  .acciones{ display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
  .btn{ border:1px solid var(--black); background:var(--black); color:var(--cream); padding:11px 14px; font:inherit; font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn.sec{ background:transparent; color:var(--black); }
  .btn.bad{ background:var(--bad); border-color:var(--bad); }
  .btn.ok{ background:var(--ok); border-color:var(--ok); }
  a.link{ color:var(--black); font-weight:600; }
  label{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--taupe-deep); display:block; margin-bottom:4px; }
  input, textarea{ font:inherit; font-size:16px; padding:8px 10px; border:1px solid var(--line); background:#fff; max-width:100%; }
  .chip{ display:inline-block; font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; padding:4px 8px; border-radius:20px; background:var(--sand); }
  .chip.ok{ background:#e3efe0; color:var(--ok); } .chip.bad{ background:#f5e1e1; color:var(--bad); } .chip.warn{ background:#f5ecd6; color:var(--warn); }
  .vacio{ text-align:center; color:var(--muted); padding:40px; }
  .aviso{ position:fixed; left:50%; bottom:16px; transform:translateX(-50%); width:max-content; max-width:calc(100% - 24px); background:var(--black); color:var(--cream); padding:12px 16px; font-size:13px; display:none; z-index:20; }
  .aviso.error{ background:var(--bad); }
  .historial{ white-space:pre-line; font-size:11px; color:var(--muted); margin-top:10px; }
  .pie{ display:flex; justify-content:flex-end; gap:16px; margin-top:12px; }
  .btn-mover{ background:none; border:0; color:var(--black); font:inherit; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; text-decoration:underline; cursor:pointer; padding:6px 0; }
  .manija{ cursor:grab; color:var(--taupe-deep); font-size:18px; line-height:1; user-select:none; padding:2px 4px; }
  .manija:active{ cursor:grabbing; }
  .card.arrastrando{ opacity:.45; }
  body.modo-arrastre .tab:not(.activa){ outline:2px dashed var(--taupe); outline-offset:-4px; }
  .tab.drop{ background:var(--sand) !important; color:var(--black) !important; outline:2px solid var(--black) !important; }
  .opcion{ display:flex; flex-direction:column; gap:4px; margin-top:10px; }
  .opcion small{ font-size:11px; color:var(--muted); }
  @media (hover:none){ .manija{ display:none; } }
  .btn-eliminar{ background:none; border:0; color:var(--bad); font:inherit; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; text-decoration:underline; cursor:pointer; padding:6px 0; }
  .hoja .btn-eliminar{ flex:1 1 100%; text-align:center; margin-top:6px; }
  .alerta{ font-size:13px; line-height:1.5; background:#f5e1e1; border-left:3px solid var(--bad); padding:10px 12px; margin-top:12px; }

  /* Pasos de agendado */
  .paso{ border-top:1px solid var(--line); margin-top:14px; padding-top:14px; }
  .paso h4{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; margin-bottom:10px; }
  .paso.oculto{ display:none; }
  .agendar{ display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start; }
  .campos{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:10px; }
  .carga{ font-size:12px; padding:8px 10px; background:var(--cream); border-left:3px solid var(--taupe); margin-bottom:10px; }
  .carga.llena{ border-color:var(--bad); }
  .en-cal{ font-size:13px; padding:10px 12px; background:#f5ecd6; border-left:3px solid var(--warn); margin-bottom:10px; }
  .nota{ font-size:11px; color:var(--muted); margin-top:8px; }
  @media (max-width:760px){ .agendar{ grid-template-columns:1fr; } }

  /* Agenda */
  .agenda-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .agenda-top h2{ font-family:'Playfair Display', Georgia, serif; font-weight:400; font-size:22px; }
  .agenda-top .btn{ padding:9px 12px; }
  .leyenda{ display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-bottom:10px; }
  .leyenda i{ display:inline-block; width:10px; height:10px; margin-right:5px; vertical-align:-1px; }
  main.ancho{ max-width:1700px; }
  .semana-scroll{ width:100%; }
  .semana{ display:grid; background:#fff; border:1px solid var(--line); width:100%; }
  .dia-cab.cerrado{ background:#f4f2ee; color:var(--muted); }
  .dia-cab{ padding:6px; border-left:1px solid var(--line); border-bottom:1px solid var(--line); font-size:12px; min-width:0; position:sticky; top:var(--cab, 62px); background:#fff; z-index:2; }
  .dia-cab b{ display:block; text-transform:capitalize; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dia-cab.hoy{ background:var(--sand); }
  .dia-cab small{ display:block; font-size:10px; color:var(--muted); margin-top:2px; }
  .dia-cab small.llena{ color:var(--bad); font-weight:600; }
  .dia-cab.cerrado-web{ box-shadow:inset 0 -3px 0 var(--bad); }
  .dia-cab small.abierto{ color:var(--ok); font-weight:600; }
  .opcion .btn:disabled{ opacity:.5; cursor:default; }
  .modo-fila{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 0; border-top:1px solid var(--line); margin-top:10px; }
  .modo-fila > span{ font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
  .modo-botones{ display:flex; gap:6px; }
  .modo-botones .btn{ padding:8px 10px; font-size:10px; }
  .modo-botones .btn.actual{ opacity:1; outline:2px solid var(--black); outline-offset:2px; cursor:default; }
  @media (max-width:640px){ .hoja .modo-botones .btn{ flex:1 1 auto; } .modo-botones{ width:100%; } }
  .btn-dia{ margin-top:4px; background:none; border:1px solid var(--line); font:inherit; font-size:10px; font-weight:600; padding:3px 6px; cursor:pointer; color:var(--black); }
  .btn-dia:hover{ border-color:var(--black); }
  .extras{ border-left:1px solid var(--line); border-bottom:1px solid var(--line); padding:3px; min-height:20px; min-width:0; }
  .extras div{ font-size:10px; background:var(--cream); border-left:2px solid var(--taupe); padding:2px 4px; margin-bottom:2px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gutter{ position:relative; }
  .gutter span{ position:absolute; right:4px; font-size:10px; color:var(--muted); transform:translateY(-50%); }
  .col{ position:relative; min-width:0; border-left:1px solid var(--line); background-image:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--hora)); }
  .col.cerrado{ background-color:#f4f2ee; }
  .ev{ position:absolute; overflow:hidden; font-size:10px; line-height:1.25; padding:3px 4px; border-left:3px solid; cursor:pointer; }
  .ev b{ display:block; font-size:10px; white-space:nowrap; }
  .ev.ok{ background:#e3efe0; border-color:var(--ok); }
  .ev.pend{ background:#f5ecd6; border-color:var(--warn); }
  .ev.ext{ background:#ecebe8; border-color:var(--muted); }
  .ev.bloq{ background:repeating-linear-gradient(45deg, #e4e2de 0 6px, #d6d3ce 6px 12px); border-color:#6b6762; color:#3d3a36; }
  .extras div.bloq{ background:#dcd9d4; border-left-color:#6b6762; }
  .ev.prop{ background:repeating-linear-gradient(45deg, rgba(181,164,138,.25) 0 6px, rgba(181,164,138,.45) 6px 12px); border:2px dashed var(--taupe-deep); cursor:default; }
  .corto{ display:none; }
  .previa{ display:grid; grid-template-columns:40px 1fr; border:1px solid var(--line); background:#fff; }
  .previa .titulo{ grid-column:1 / 3; font-size:11px; font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); text-transform:capitalize; }
  @media (max-width:640px){
    .agenda-top h2{ font-size:18px; }
    /* En el celular la semana completa se desliza de lado a lado (7 días no caben legibles en 375 px). */
    .semana-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -12px; width:calc(100% + 24px); }
    .semana{ min-width:520px; border-left:0; border-right:0; }
    .dia-cab{ position:static; }
    .dia-cab{ padding:4px 3px; font-size:11px; }
    .dia-cab b{ font-size:11px; }
    .ev{ padding:2px 3px; font-size:9px; border-left-width:2px; }
    .ev b{ font-size:9px; }
    .largo{ display:none; } .corto{ display:inline; }
    .gutter span{ font-size:9px; right:2px; }
  }

  /* Detalle de una cita (hoja inferior en el celular) */
  .modal{ position:fixed; inset:0; background:rgba(11,11,11,.45); display:none; align-items:center; justify-content:center; z-index:30; padding:16px; }
  .modal.abierto{ display:flex; }
  .hoja{ background:#fff; width:100%; max-width:440px; padding:20px; max-height:90vh; overflow:auto; }
  .hoja h3{ font-family:'Playfair Display', Georgia, serif; font-weight:400; font-size:21px; margin:8px 0 4px; }
  .hoja .fila{ font-size:13px; margin-top:8px; }
  .hoja .fila span{ display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--taupe-deep); }
  .hoja .acciones{ margin-top:16px; }
  @media (max-width:640px){
    .modal{ align-items:flex-end; padding:0; }
    .hoja{ max-width:none; padding:20px 16px 26px; }
    .hoja .btn{ flex:1 1 100%; text-align:center; }
  }
  /* Búsqueda, fotos, historial de la clienta, formularios del panel */
  .filtros{ display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px; }
  .filtros input{ flex:1 1 220px; }
  .filtros input[type=date]{ flex:0 1 170px; }
  .filtros .btn{ padding:9px 12px; }
  .filtros.oculto{ display:none; }
  select{ font:inherit; font-size:16px; padding:8px 10px; border:1px solid var(--line); background:#fff; max-width:100%; }
  .form-panel .campos > div{ flex:1 1 150px; min-width:0; }
  .form-panel .campos input, .form-panel .campos select, .form-panel textarea{ width:100%; }
  .check{ display:flex; gap:8px; align-items:center; font-size:13px; text-transform:none; letter-spacing:0; color:var(--black); margin:6px 0; }
  .fotos{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; margin-top:12px; }
  .fotos a{ display:block; } .fotos img{ width:100%; height:180px; object-fit:cover; border:1px solid var(--line); }
  .hist-item{ border-top:1px solid var(--line); padding:8px 0; font-size:13px; }
  .hist-item small{ color:var(--muted); display:block; }
  .resumen-cli{ display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px; margin:10px 0; font-size:13px; }
  .resumen-cli span{ display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--taupe-deep); }
  .hoja.ancha{ max-width:620px; }
  header .der button.prim{ background:var(--cream); color:var(--black); }
  @media (max-width:640px){ header .der button{ padding:8px 7px; letter-spacing:.04em; white-space:nowrap; } .der{ gap:6px; } .logo small{ letter-spacing:.15em; } .logo{ font-size:18px; } }
</style>

<body>
<header>
  <div class="logo">AMARË<small>PANEL DE RESERVAS</small></div>
  <div class="der"><span id="sync"></span>
    <button class="prim" onclick="pedirCitaManual()" title="Agregar una cita desde el panel">+ Cita</button>
    <button onclick="pedirBloqueo()" title="Bloquear un espacio (vacaciones, ausencias…)">Bloquear</button>
    <button onclick="cargar()">Actualizar</button></div>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div class="filtros" id="filtros">
    <input type="search" id="buscar" placeholder="Buscar por nombre, correo o teléfono" oninput="FILTRO.texto=this.value;pintar()">
    <input type="date" id="buscarFecha" title="Filtrar por fecha" oninput="FILTRO.fecha=this.value;pintar()">
    <button class="btn sec" onclick="limpiarFiltro()">Limpiar</button>
  </div>
  <div id="lista"><p class="vacio">Cargando reservas…</p></div>
</main>
<div class="modal" id="modal" onclick="if(event.target===this)cerrarModal()"><div class="hoja" id="hoja"></div></div>
<div class="aviso" id="aviso"></div>

<script>
  var DATOS = { reservas: [], ajustes: { limiteHoras: 6, tope: 4 }, modos: {}, horasSinDuracion: 2,
                activos: ['pago_por_validar','pago_aprobado','cita_agendada','cita_confirmada','requiere_aprobacion'], agenda: [], hoy: '' };
  var FILTRO = { texto: '', fecha: '' };
  var ARRASTRANDO = null;  // id de la reserva que se está arrastrando hacia una pestaña
  var CARGA = {};          // fecha -> ocupación, calculada aquí mismo para que sea instantánea
  var CACHE = {};          // fecha -> eventos de Google Calendar de ese día
  var VISTA = [];          // eventos pintados en la agenda (para abrir el detalle)
  var TAB = 'por_agendar';
  var SEMANA = '';         // lunes de la semana visible en Agenda
  var PX_HORA = 44, H0 = 8, H1 = 19;
  var DIAS_CERRADOS = [0, 1];
  var COLA = [], OCUPADO = false; // acciones que se guardan de fondo, una por una y en orden
  var TABS = [
    ['agenda', 'Agenda'],
    ['requiere_aprobacion', 'Requiere aprobación'],
    ['por_agendar', 'Por agendar'],
    ['cita_confirmada', 'Confirmadas'],
    ['historial', 'Historial']
  ];

  // ---------------------------------------------------------------- utilidades
  function colones(n){ return '₡' + String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function fechaD(iso){ return new Date(iso + 'T12:00:00'); }
  function isoDe(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function sumaDias(iso, n){ var d = fechaD(iso); d.setDate(d.getDate() + n); return isoDe(d); }
  function lunesDe(iso){ var d = fechaD(iso), w = (d.getDay() + 6) % 7; return sumaDias(iso, -w); }
  function fechaLarga(iso){ return iso ? fechaD(iso).toLocaleDateString('es-CR', { weekday:'long', day:'numeric', month:'long', year:'numeric' }) : '—'; }
  function fechaCorta(iso){ return fechaD(iso).toLocaleDateString('es-CR', { weekday:'short', day:'numeric', month:'short' }); }
  function diaCorto(iso){ var d = fechaD(iso); return d.toLocaleDateString('es-CR', { weekday:'short' }).replace('.','') + ' ' + d.getDate(); }
  function horas(hhmm){ var p = String(hhmm).split(':'); return Number(p[0]) + Number(p[1]||0)/60; }
  function h12(hhmm){ var p = String(hhmm).split(':'), h = Number(p[0]); return ((h+11)%12+1) + ':' + (p[1]||'00') + (h<12?' am':' pm'); }
  function hCorta(hhmm){ var p = String(hhmm).split(':'), h = (Number(p[0])+11)%12+1; return p[1] && p[1] !== '00' ? h + ':' + p[1] : String(h); }
  function sumarHoras(hhmm, hs){
    var t = Math.min(horas(hhmm)*60 + Math.round(hs*60), 23*60+45);
    return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
  }
  function nombreCorto(n){ return String(n||'').split(' ')[0]; }
  var tAviso;
  function aviso(t, error){
    var a = document.getElementById('aviso'); a.textContent = t; a.className = 'aviso' + (error ? ' error' : ''); a.style.display = 'block';
    clearTimeout(tAviso); tAviso = setTimeout(function(){ a.style.display = 'none'; }, error ? 7000 : 3000);
  }
  function editando(){ var a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }

  // ---------------------------------------------------------------- cupo (mismo criterio que el servidor)
  // Cada franja (mañana 00:00–11:59, tarde 12:00–23:59) se llena sola por citas u horas dentro de ella.
  // Una cita que cruza las 12:00 cuenta como cita en ambas y sus horas se reparten. Igual que el servidor.
  function tieneHorario(r){ return (r.estado === 'cita_confirmada' || r.estado === 'cita_agendada') && r.fecha_cita && r.hora_inicio && r.hora_fin; }
  /** { manana: { citas, horas }, tarde: { citas, horas } } con eventos del calendario + reservas web sin hora. */
  function ocupacionDia(f){
    var corte = DATOS.corte || 12, o = { manana: { citas: 0, horas: 0 }, tarde: { citas: 0, horas: 0 } };
    var sumar = function(ini, fin){
      var partes = { manana: Math.min(fin, corte) - Math.max(ini, 0), tarde: Math.min(fin, 24) - Math.max(ini, corte) };
      ['manana', 'tarde'].forEach(function(fr){ if (partes[fr] > 0) { o[fr].citas++; o[fr].horas += partes[fr]; } });
    };
    (CACHE[f] || []).forEach(function(e){
      // "Espacio bloqueado" no suma horas: cierra en la web las franjas que toca (igual que el servidor).
      if (e.bloqueo) {
        var fin = e.fin === '23:59' ? 24 : horas(e.fin);
        (e.todoElDia ? ['manana', 'tarde'] : franjasDeTramo(horas(e.ini), fin)).forEach(function(fr){ o[fr].bloqueo = true; });
        return;
      }
      if (!e.todoElDia) sumar(horas(e.ini), e.fin === '23:59' ? 24 : horas(e.fin));
    });
    var inicios = DATOS.inicios || { manana: 9, tarde: 13 };
    DATOS.reservas.forEach(function(r){
      if (DATOS.activos.indexOf(r.estado) < 0 || tieneHorario(r) || r.fecha_solicitada !== f) return;
      var ini = r.hora_solicitada ? horas(r.hora_solicitada) : (r.franja === 'Tarde' ? inicios.tarde : inicios.manana);
      sumar(ini, Math.min(ini + (Number(r.dur_max_h) || Number(r.dur_min_h) || DATOS.horasSinDuracion), 24));
    });
    o.manana.horas = Math.round(o.manana.horas * 10) / 10;
    o.tarde.horas = Math.round(o.tarde.horas * 10) / 10;
    return o;
  }
  function franjasDeTramo(ini, fin){
    var corte = DATOS.corte || 12, f = [];
    if (ini < corte && fin > 0) f.push('manana');
    if (fin > corte) f.push('tarde');
    return f.length ? f : ['manana'];
  }
  // ---------------------------------------------------------------- disponibilidad en la web (día, mañana, tarde)
  var FRANJAS = [['manana', 'Mañana'], ['tarde', 'Tarde']];
  /** Modo manual de una franja: 'bloquear' | 'abrir' | 'auto' */
  function modoFranja(f, fr){ return ((DATOS.modos || {})[f] || {})[fr] || 'auto'; }
  /** Cierre automático de una franja por las reglas: 'citas' | 'horas' | '' */
  function cierreAuto(f, fr){
    var o = ocupacionDia(f)[fr];
    if (o.bloqueo) return 'bloqueo';
    if (o.citas >= DATOS.ajustes.tope) return 'citas';
    if (o.horas >= DATOS.ajustes.limiteHoras) return 'horas';
    return '';
  }
  /** Hora actual de Costa Rica: { iso, hora } */
  function ahoraCR(){
    var p = {};
    new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Costa_Rica', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
    return { iso: p.year + '-' + p.month + '-' + p.day, hora: Number(p.hour) + Number(p.minute) / 60 };
  }
  /** La mañana de hoy deja de ofrecerse a las 12:00 y la tarde al cierre (18:00), igual que la página y el servidor. */
  function franjaPasada(f, fr){
    var a = ahoraCR();
    return f < a.iso || (f === a.iso && a.hora >= (fr === 'tarde' ? 18 : (DATOS.corte || 12)));
  }
  /** Estado de una franja en la web: 'pasada' | 'bloqueada' | 'abierta' | 'citas' | 'horas' | 'libre' */
  function estadoFranja(f, fr){
    if (franjaPasada(f, fr)) return 'pasada';
    var m = modoFranja(f, fr);
    if (m === 'bloquear') return 'bloqueada';
    var auto = cierreAuto(f, fr);
    if (auto === 'bloqueo') return 'bloqueo';   // un espacio bloqueado gana incluso a "Abrir"
    if (m === 'abrir') return 'abierta';
    return auto || 'libre';
  }
  function franjaCerrada(e){ return e === 'pasada' || e === 'bloqueada' || e === 'horas' || e === 'citas' || e === 'bloqueo'; }
  /** "3/6 h · 2/4 citas" de una franja */
  function textoOcupacion(o){ return o.horas + '/' + DATOS.ajustes.limiteHoras + ' h · ' + o.citas + '/' + DATOS.ajustes.tope + ' citas'; }
  /** El día no se ofrece en la web solo si mañana y tarde están cerradas. */
  function motivoCierre(f){
    var m = estadoFranja(f, 'manana'), t = estadoFranja(f, 'tarde');
    if (!franjaCerrada(m) || !franjaCerrada(t)) return '';
    return m === t ? (m === 'bloqueada' ? 'manual' : m) : 'mixto';
  }
  var TEXTO_ESTADO = { bloqueo: 'espacio bloqueado', bloqueada: 'bloqueada a mano', abierta: 'abierta a mano', horas: 'llena por horas', citas: 'llena por citas', pasada: 'ya pasó', libre: 'disponible' };
  /** Resumen corto para el encabezado del día en la Agenda. */
  function resumenDisponibilidad(f){
    if (f < DATOS.hoy) return '';
    var m = estadoFranja(f, 'manana'), t = estadoFranja(f, 'tarde');
    if (m === t) {
      if (m === 'libre') return '';
      var txt = { bloqueo: 'Espacio bloqueado', bloqueada: 'Bloqueado a mano', abierta: 'Abierto a mano', horas: 'Lleno por horas', citas: 'Lleno por citas', pasada: 'Ya cerró por hoy' }[m];
      return '<small class="' + (m === 'abierta' ? 'abierto' : 'llena') + '">' + txt + '</small>';
    }
    return FRANJAS.map(function(x){
      var e = x[0] === 'manana' ? m : t;
      return '<small class="' + (e === 'abierta' ? 'abierto' : (franjaCerrada(e) ? 'llena' : '')) + '">' + x[1] + ': ' + TEXTO_ESTADO[e] + '</small>';
    }).join('');
  }

  function calcularCarga(){
    CARGA = {};
    DATOS.reservas.forEach(function(r){
      if (DATOS.activos.indexOf(r.estado) < 0) return;
      var f = tieneHorario(r) ? r.fecha_cita : r.fecha_solicitada; if (!f) return;
      CARGA[f] = (CARGA[f] || 0) + 1;
    });
  }

  // ---------------------------------------------------------------- datos
  function guardarAgenda(desde, hasta, eventos){
    for (var f = desde; f <= hasta; f = sumaDias(f, 1)) CACHE[f] = [];
    eventos.forEach(function(e){ (CACHE[e.fecha] = CACHE[e.fecha] || []).push(e); });
  }
  function recibir(d){
    DATOS = d;
    CACHE = {};
    guardarAgenda(d.agendaDesde, d.agendaHasta, d.agenda || []);
    if (!SEMANA) SEMANA = lunesDe(d.hoy);
    pintar();
  }
  /** Asegura que tengamos los eventos de [desde, hasta]; si falta algo lo pide al servidor. */
  function asegurarAgenda(desde, hasta, listo){
    for (var f = desde; f <= hasta; f = sumaDias(f, 1)) {
      if (!CACHE[f]) {
        google.script.run.withSuccessHandler(function(evs){ guardarAgenda(desde, hasta, evs); listo(); })
          .withFailureHandler(function(e){ aviso('Error al leer el calendario: ' + e.message, true); }).agenda(desde, hasta);
        return false;
      }
    }
    return true;
  }
  function reservaPorId(id){ return DATOS.reservas.filter(function(r){ return r.id === id; })[0]; }
  function sinHora(fecha){
    return DATOS.reservas.filter(function(r){
      return (r.estado === 'pago_por_validar' || r.estado === 'pago_aprobado' || r.estado === 'requiere_aprobacion') && r.fecha_solicitada === fecha;
    });
  }
  // Cambios locales en la agenda (se ven al instante; el servidor confirma después).
  function quitarEventos(id){ Object.keys(CACHE).forEach(function(f){ CACHE[f] = CACHE[f].filter(function(e){ return e.reserva !== id; }); }); }
  function ponerEvento(r){
    quitarEventos(r.id);
    (CACHE[r.fecha_cita] = CACHE[r.fecha_cita] || []).push({ id: r.evento_id || '', titulo: r.servicio + ' · ' + r.nombre, fecha: r.fecha_cita, ini: r.hora_inicio, fin: r.hora_fin,
      reserva: r.id, estado: r.estado, nombre: r.nombre, servicio: r.servicio, celular: r.celular });
  }
  function estadoEvento(id, estado){ Object.keys(CACHE).forEach(function(f){ CACHE[f].forEach(function(e){ if (e.reserva === id) e.estado = estado; }); }); }

  // ---------------------------------------------------------------- pestañas
  /** Reserva web que se agendó sola y el salón todavía no revisó (ajustar duración real). */
  function porRevisar(r){ return r.estado === 'cita_confirmada' && !r.revisada && r.origen === 'web'; }
  function enTab(r, tab){
    if (tab === 'requiere_aprobacion') return r.estado === 'requiere_aprobacion' || r.estado === 'pago_por_validar';
    if (tab === 'por_agendar') return r.estado === 'pago_aprobado' || r.estado === 'dia_saturado' || r.estado === 'cita_agendada' || porRevisar(r);
    if (tab === 'cita_confirmada') return r.estado === 'cita_confirmada' && !porRevisar(r);
    if (tab === 'historial') return ['pago_rechazado', 'cancelada', 'completada', 'no_asistio'].indexOf(r.estado) >= 0;
    return r.estado === tab;
  }
  function soloDigitos(t){ return String(t || '').replace(/\D/g, ''); }
  function sinTildes(t){ return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  /** Búsqueda por nombre, correo, teléfono y fecha (solicitada o en calendario). */
  function pasaFiltro(r){
    if (FILTRO.fecha && r.fecha_solicitada !== FILTRO.fecha && r.fecha_cita !== FILTRO.fecha) return false;
    var q = sinTildes(FILTRO.texto).trim();
    if (!q) return true;
    var dq = soloDigitos(q);
    return sinTildes(r.nombre).indexOf(q) >= 0 || sinTildes(r.correo).indexOf(q) >= 0 || sinTildes(r.servicio).indexOf(q) >= 0 ||
      (dq.length >= 3 && soloDigitos(r.celular).indexOf(dq) >= 0) || String(r.id).toLowerCase().indexOf(q) >= 0;
  }
  function limpiarFiltro(){
    FILTRO = { texto: '', fecha: '' };
    document.getElementById('buscar').value = ''; document.getElementById('buscarFecha').value = '';
    pintar();
  }
  function pintarTabs(){
    document.getElementById('tabs').innerHTML = TABS.map(function(t){
      var n = t[0] === 'agenda' ? '' : '<span>' + DATOS.reservas.filter(function(r){ return enTab(r, t[0]); }).length + '</span>';
      var soltar = t[0] === 'agenda' ? '' : ' ondragover="sobreTab(event,this)" ondragleave="this.classList.remove(\'drop\')" ondrop="soltarEnTab(event,\'' + t[0] + '\',this)"';
      return '<button class="tab' + (TAB===t[0]?' activa':'') + '"' + soltar + ' onclick="irTab(\'' + t[0] + '\')">' + t[1] + n + '</button>';
    }).join('');
  }
  function irTab(t){ TAB = t; pintar(); window.scrollTo(0, 0); }
  function pintar(){
    calcularCarga();
    document.querySelector('main').classList.toggle('ancho', TAB === 'agenda');
    pintarTabs();
    document.getElementById('filtros').classList.toggle('oculto', TAB === 'agenda');
    if (TAB === 'agenda') return pintarAgenda();
    var lista = DATOS.reservas.filter(function(r){ return enTab(r, TAB) && pasaFiltro(r); });
    if (TAB === 'cita_confirmada' || TAB === 'por_agendar') lista.sort(function(a,b){ return ((a.fecha_cita || a.fecha_solicitada) + a.hora_inicio).localeCompare((b.fecha_cita || b.fecha_solicitada) + b.hora_inicio); });
    var filtrando = FILTRO.texto || FILTRO.fecha;
    document.getElementById('lista').innerHTML = lista.length ? lista.map(tarjeta).join('') :
      '<p class="vacio">' + (filtrando ? 'Ninguna reserva de esta sección coincide con la búsqueda.' : 'No hay reservas en esta sección.') + '</p>';
    lista.forEach(function(r){ var f = document.getElementById('f-' + r.id); if (f && !f.classList.contains('oculto')) pintarPrevia(r.id); });
  }
  function irAReserva(id){
    cerrarModal();
    var r = reservaPorId(id); if (!r) return;
    TAB = TABS.map(function(t){ return t[0]; }).filter(function(t){ return t !== 'agenda' && enTab(r, t); })[0] || 'historial';
    pintar();
    var c = document.getElementById('c-' + id);
    if (c) { c.classList.add('resaltada'); c.scrollIntoView({ behavior:'smooth', block:'start' }); }
  }

  // ---------------------------------------------------------------- columna de un día (agenda y vista previa)
  function claseEvento(e){
    if (e.bloqueo) return 'bloq';
    var r = e.reserva && reservaPorId(e.reserva);
    if (r && porRevisar(r)) return 'pend';
    return (e.estado === 'cita_confirmada' || e.estado === 'completada') ? 'ok' : (e.estado === 'cita_agendada' ? 'pend' : 'ext');
  }

  /** Reparte los eventos que se cruzan en carriles lado a lado. */
  function carriles(evs){
    evs = evs.slice().sort(function(a,b){ return horas(a.ini) - horas(b.ini) || horas(b.fin) - horas(a.fin); });
    var grupo = [], finGrupo = -1, fines = [];
    function cerrar(){ grupo.forEach(function(e){ e._n = fines.length; }); grupo = []; fines = []; }
    evs.forEach(function(e){
      var a = horas(e.ini), b = Math.max(horas(e.fin), a + .25);
      if (a >= finGrupo) cerrar();
      var l = 0; while (l < fines.length && fines[l] > a) l++;
      fines[l] = b; e._l = l; grupo.push(e); finGrupo = Math.max(finGrupo, b);
    });
    cerrar();
    return evs;
  }

  function columna(fecha, evs, propuesta){
    var todos = evs.filter(function(e){ return !e.todoElDia; });
    if (propuesta) todos = todos.concat([{ ini: propuesta.ini, fin: propuesta.fin, prop: true, titulo: 'Esta cita' }]);
    todos = carriles(todos);
    var cerrado = DIAS_CERRADOS.indexOf(fechaD(fecha).getDay()) >= 0;
    var h = '<div class="col' + (cerrado ? ' cerrado' : '') + '" style="--hora:' + PX_HORA + 'px;height:' + ((H1-H0)*PX_HORA) + 'px">';
    todos.forEach(function(e){
      var a = Math.max(horas(e.ini), H0), b = Math.min(Math.max(horas(e.fin), horas(e.ini) + .25), H1);
      var top = (a - H0) * PX_HORA, alto = Math.max((b - a) * PX_HORA - 2, 16);
      var ancho = 100 / e._n, izq = ancho * e._l;
      var n = VISTA.push(e) - 1;
      var largo = e.prop ? 'Esta cita' : (e.nombre ? esc(e.servicio) + ' · ' + esc(e.nombre) : esc(e.titulo));
      var corto = e.prop ? 'Esta' : esc(e.nombre ? nombreCorto(e.nombre) : e.titulo);
      h += '<div class="ev ' + (e.prop ? 'prop' : claseEvento(e)) + '"' + (e.prop ? '' : ' onclick="verEvento(' + n + ')"') +
        ' style="top:' + top + 'px;height:' + alto + 'px;left:calc(' + izq + '% + 1px);width:calc(' + ancho + '% - 2px)">' +
        '<b><span class="largo">' + h12(e.ini) + '–' + h12(e.fin) + '</span><span class="corto">' + hCorta(e.ini) + '–' + hCorta(e.fin) + '</span></b>' +
        '<span class="largo">' + largo + '</span><span class="corto">' + corto + '</span></div>';
    });
    return h + '</div>';
  }
  function gutter(){
    var h = '<div class="gutter" style="height:' + ((H1-H0)*PX_HORA) + 'px">';
    for (var i = H0 + 1; i < H1; i++) h += '<span style="top:' + ((i-H0)*PX_HORA) + 'px">' + hCorta(i + ':00') + (i < 12 ? 'a' : 'p') + '</span>';
    return h + '</div>';
  }
  function ajustarHoras(evs){
    H0 = 8; H1 = 19;
    evs.forEach(function(e){ if (e.todoElDia) return; H0 = Math.min(H0, Math.floor(horas(e.ini))); H1 = Math.max(H1, Math.ceil(horas(e.fin))); });
  }

  // ---------------------------------------------------------------- pestaña Agenda
  function pintarAgenda(){
    var desde = SEMANA, hasta = sumaDias(SEMANA, 6);
    var cont = document.getElementById('lista');
    if (!asegurarAgenda(desde, hasta, pintarAgenda)) { cont.innerHTML = '<p class="vacio">Leyendo el calendario…</p>'; return; }
    VISTA = [];
    var dias = [];
    for (var i = 0; i < 7; i++) dias.push(sumaDias(desde, i)); // semana completa, lunes a domingo
    var todos = [];
    dias.forEach(function(f){ todos = todos.concat(CACHE[f] || []); });
    ajustarHoras(todos);

    var h = '<div class="agenda-top"><h2>' + fechaCorta(desde) + ' – ' + fechaCorta(hasta) + '</h2><div class="acciones">' +
      '<button class="btn sec" onclick="moverSemana(-7)">‹</button>' +
      '<button class="btn sec" onclick="SEMANA=lunesDe(DATOS.hoy);pintarAgenda()">Hoy</button>' +
      '<button class="btn sec" onclick="moverSemana(7)">›</button>' +
      '<button class="btn sec" onclick="pedirAjustes()" title="Horas y reservas que cierran un día">Ajustes</button></div></div>' +
      '<div class="leyenda"><span><i style="background:#e3efe0;border-left:3px solid var(--ok)"></i>Confirmada</span>' +
      '<span><i style="background:#f5ecd6;border-left:3px solid var(--warn)"></i>Por revisar duración</span>' +
      '<span><i style="background:#dcd9d4;border-left:3px solid #6b6762"></i>Espacio bloqueado</span>' +
      '<span><i style="background:#ecebe8;border-left:3px solid var(--muted)"></i>Otro evento</span></div>' +
      '<div class="semana-scroll"><div class="semana" style="grid-template-columns:34px repeat(' + dias.length + ', minmax(0, 1fr))">';

    h += '<div class="dia-cab" style="border-left:0"></div>';
    dias.forEach(function(f){
      var oc = ocupacionDia(f);
      var motivo = motivoCierre(f);
      var cerr = DIAS_CERRADOS.indexOf(fechaD(f).getDay()) >= 0;
      var pasado = f < DATOS.hoy;
      h += '<div class="dia-cab' + (f === DATOS.hoy ? ' hoy' : (cerr ? ' cerrado' : '')) + (motivo ? ' cerrado-web' : '') + '"><b><span class="largo">' + fechaCorta(f) + '</span><span class="corto">' + diaCorto(f) + '</span></b>' +
        '<small><span class="largo">M ' + oc.manana.horas + 'h·' + oc.manana.citas + ' · T ' + oc.tarde.horas + 'h·' + oc.tarde.citas + '</span>' +
          '<span class="corto">M' + oc.manana.citas + ' T' + oc.tarde.citas + '</span></small>' +
        resumenDisponibilidad(f) +
        (pasado ? '' : '<button class="btn-dia" onclick="pedirModoDia(\'' + f + '\')">Disponibilidad</button>') +
        '</div>';
    });
    h += '<div class="extras" style="border-left:0"></div>';
    dias.forEach(function(f){
      h += '<div class="extras">' +
        (CACHE[f] || []).filter(function(e){ return e.todoElDia; }).map(function(e){
          var n = VISTA.push(e) - 1;
          return '<div' + (e.bloqueo ? ' class="bloq"' : '') + ' onclick="verEvento(' + n + ')" title="Todo el día">' + esc(e.titulo) + '</div>';
        }).join('') +
        sinHora(f).map(function(r){
          var txt = r.estado === 'requiere_aprobacion' ? 'Por aprobar · ' : 'Sin hora · ';
          return '<div onclick="irAReserva(\'' + r.id + '\')" title="Todavía no está en el calendario">' + txt + esc(nombreCorto(r.nombre)) + (r.hora_solicitada ? ' ' + hCorta(r.hora_solicitada) : '') + '</div>';
        }).join('') + '</div>';
    });
    h += gutter();
    dias.forEach(function(f){ h += columna(f, CACHE[f] || []); });
    cont.innerHTML = h + '</div></div><p class="nota">Se actualiza sola cada minuto. Toca una cita para ver el detalle. Domingo y lunes en gris: cerrado para reservas en línea. ' +
      'Usa <b>+ Cita</b> para agregar una cita y <b>Bloquear</b> para apartar un espacio sin clienta (vacaciones, ausencias).</p>';
  }
  function moverSemana(n){ SEMANA = sumaDias(SEMANA, n); pintarAgenda(); }

  // ---------------------------------------------------------------- detalle de una cita
  function verEvento(n){
    var e = VISTA[n]; if (!e) return;
    var r = e.reserva ? reservaPorId(e.reserva) : null;
    var h = '';
    if (r) {
      h = chipEstado(r.estado) + '<h3>' + esc(r.nombre) + '</h3>' +
        '<div class="fila"><span>Cuándo</span>' + fechaLarga(e.fecha) + ' · ' + h12(e.ini) + '–' + h12(e.fin) + '</div>' +
        '<div class="fila"><span>Servicio</span>' + esc(r.servicio) + ' · ' + esc(r.categoria) + ' · largo ' + esc(r.largo) + '</div>' +
        '<div class="fila"><span>Depósito</span>' + (Number(r.deposito)>0 ? colones(r.deposito) : 'No requiere') + '</div>' +
        (r.comentarios ? '<div class="fila"><span>Comentarios</span>' + esc(r.comentarios) + '</div>' : '') +
        '<div class="acciones">' +
          (r.estado === 'cita_agendada' ? '<button class="btn ok" onclick="cerrarModal();confirmar(\'' + r.id + '\')">Confirmar y enviar correo</button>' : '') +
          (porRevisar(r) ? '<button class="btn ok" onclick="cerrarModal();revisada(\'' + r.id + '\')">Horario correcto</button>' : '') +
          botonWhatsApp(r) +
          '<button class="btn sec" onclick="irAReserva(\'' + r.id + '\')">Ver reserva</button>' +
          '<button class="btn sec" onclick="pedirMover(\'' + r.id + '\')">Mover a…</button>' +
          '<button class="btn sec" onclick="cerrarModal()">Cerrar</button>' +
          '<button class="btn-eliminar" onclick="pedirEliminar(\'' + r.id + '\')">Eliminar</button>' +
        '</div>';
    } else if (e.bloqueo) {
      h = '<span class="chip">Espacio bloqueado</span><h3>' + esc(e.titulo) + '</h3>' +
        '<div class="fila"><span>Cuándo</span>' + fechaLarga(e.fecha) + (e.todoElDia ? ' · todo el día' : ' · ' + h12(e.ini) + '–' + h12(e.fin)) + '</div>' +
        '<p class="nota">Bloqueo interno: no se envía nada a nadie y la web no ofrece ese espacio.</p>' +
        '<div class="acciones"><button class="btn bad" onclick="quitarBloqueoPanel(\'' + esc(e.id) + '\')">Quitar bloqueo</button>' +
        '<button class="btn sec" onclick="cerrarModal()">Cerrar</button></div>';
    } else {
      h = '<span class="chip">Google Calendar</span><h3>' + esc(e.titulo) + '</h3>' +
        '<div class="fila"><span>Cuándo</span>' + fechaLarga(e.fecha) + ' · ' + h12(e.ini) + '–' + h12(e.fin) + '</div>' +
        '<p class="nota">Evento creado directamente en Google Calendar.</p>' +
        '<div class="acciones"><button class="btn sec" onclick="cerrarModal()">Cerrar</button></div>';
    }
    document.getElementById('hoja').innerHTML = h;
    document.getElementById('modal').classList.add('abierto');
  }
  /**
   * Disponibilidad en la web, a decisión del admin, para el día completo, la mañana o la tarde:
   *  Automático → reglas normales (horas, tope de reservas y matriz).
   *  Bloquear   → no se ofrece en la web aunque haya espacio.
   *  Abrir      → se ofrece aunque las reglas lo cierren (ignora horas, tope y "No permitir" de la matriz).
   */
  function pedirModoDia(f){
    var mm = modoFranja(f, 'manana'), mt = modoFranja(f, 'tarde');
    var fila = function(franja, titulo, actual){
      var b = function(modo, texto, clase){
        var es = modo === actual;
        return '<button class="btn ' + clase + (es ? ' actual' : '') + '"' + (es ? ' disabled' : '') +
          ' onclick="cambiarModoDia(\'' + f + '\',\'' + modo + '\',\'' + franja + '\')">' + texto + '</button>';
      };
      return '<div class="modo-fila"><span>' + titulo + '</span><div class="modo-botones">' +
        b('auto', 'Automático', 'sec') + b('bloquear', 'Bloquear', 'bad') + b('abrir', 'Abrir', 'ok') + '</div></div>';
    };
    document.getElementById('hoja').innerHTML =
      '<span class="chip">Disponibilidad en la web</span><h3>' + fechaLarga(f) + '</h3>' +
      '<div class="fila"><span>Ahora</span>Mañana: ' + TEXTO_ESTADO[estadoFranja(f, 'manana')] + ' · Tarde: ' + TEXTO_ESTADO[estadoFranja(f, 'tarde')] + '</div>' +
      '<div class="fila"><span>Ocupación</span>Mañana ' + textoOcupacion(ocupacionDia(f).manana) + '<br>Tarde ' + textoOcupacion(ocupacionDia(f).tarde) + '</div>' +
      fila('dia', 'Día completo', mm === mt ? mm : '') +

  function cambiarModoDia(f, modo, franja){
    DATOS.modos = DATOS.modos || {};
    var dia = DATOS.modos[f] || {};
    (franja === 'dia' ? ['manana', 'tarde'] : [franja]).forEach(function(fr){ if (modo === 'auto') delete dia[fr]; else dia[fr] = modo; });
    if (dia.manana || dia.tarde) DATOS.modos[f] = dia; else delete DATOS.modos[f];
    pintar();
    pedirModoDia(f);   // la ventana queda abierta mostrando el cambio
    var que = { dia: 'Día', manana: 'Mañana', tarde: 'Tarde' }[franja];
    aviso(que + ': ' + { bloquear: 'bloqueada para la web.', abrir: 'abierta en la web (ignora las reglas).', auto: 'en automático.' }[modo]);

  function guardarAjustes(){
    var hs = Number(document.getElementById('aj-horas').value), tope = Number(document.getElementById('aj-tope').value);
    if (!(hs > 0 && hs <= 12) || !(tope >= 1 && tope <= 50)) return aviso('Revisa los valores: horas de 1 a 12 y citas de 1 a 50.', true);
    cerrarModal();
    DATOS.ajustes = { limiteHoras: hs, tope: Math.round(tope) };
    pintar();
    aviso('Ajustes aplicados.');
    COLA.push({ fn: 'guardarAjustes', args: [hs, tope], textoListo: 'Ajustes guardados ✓' });
    procesarCola();
  }

  function chipEstado(e, r){

              cita_agendada:['En calendario · falta confirmar','warn'], cita_confirmada:['Cita confirmada','ok'],
              pago_rechazado:['Pago rechazado','bad'], cancelada:['Cancelada','bad'],

    var titulo = porRevisar(r) ? 'Ajustar fecha y duración' : (r.estado === 'cita_confirmada' ? 'Mover la cita' : (r.estado === 'cita_agendada' ? 'Cambiar fecha u hora' : 'Paso 1 · Elegir fecha y hora'));

          'Si cambias la <b>fecha</b> o la hora de <b>inicio</b>, le llega el aviso con la nueva hora por WhatsApp y correo.</p>'

        ' (duración estimada). Ajusta la hora de fin según la duración real; la clienta ya recibió su confirmación.</div>' +

  /** Mensaje de WhatsApp listo para enviar a mano (mientras no esté conectada la API, o para cualquier consulta). */

  /** Visor de las fotos del cabello (se leen de Drive solo al abrirlo). */

    document.getElementById('hoja').innerHTML = '<span class="chip">Fotos del cabello</span><h3>' + esc(r.nombre) + '</h3>' +

      }).join('') : '<p class="nota">Esta reserva no tiene fotos.</p>';
    }).withFailureHandler(function(e){ var c = document.getElementById('fotosVisor'); if (c) c.innerHTML = '<p class="nota">' + esc(e.message) + '</p>'; }).fotosReserva(id);

  /** Historial de la clienta: todas sus reservas (mismo celular o correo), procedimientos y última visita. */
  function verCliente(id){
    var r = reservaPorId(id); if (!r) return;
    var tel = soloDigitos(r.celular).slice(-8), correo = String(r.correo || '').toLowerCase();
    var suyas = DATOS.reservas.filter(function(x){
      return (tel.length === 8 && soloDigitos(x.celular).slice(-8) === tel) || (correo && String(x.correo || '').toLowerCase() === correo);
    }).sort(function(a, b){ return String(b.fecha_cita || b.fecha_solicitada).localeCompare(String(a.fecha_cita || a.fecha_solicitada)); });
    var visitas = suyas.filter(function(x){ return x.estado === 'completada'; });
    var ultimaVisita = visitas[0], ultimaReserva = suyas.slice().sort(function(a, b){ return String(b.creado).localeCompare(String(a.creado)); })[0];
    var procs = {};
    visitas.forEach(function(x){ procs[x.servicio] = (procs[x.servicio] || 0) + 1; });
    document.getElementById('hoja').className = 'hoja ancha';
    document.getElementById('hoja').innerHTML = '<span class="chip">Historial de la clienta</span><h3>' + esc(r.nombre) + '</h3>' +
      '<div class="fila"><span>Contacto</span>' + esc(r.celular || '—') + ' · ' + esc(r.correo || '—') + '</div>' +
      '<div class="resumen-cli">' +
        '<div><span>Reservas</span>' + suyas.length + '</div>' +
        '<div><span>Visitas completadas</span>' + visitas.length + '</div>' +
        '<div><span>Última visita</span>' + (ultimaVisita ? fechaCorta(ultimaVisita.fecha_cita || ultimaVisita.fecha_solicitada) : '—') + '</div>' +
        '<div><span>Última reserva</span>' + (ultimaReserva && ultimaReserva.creado ? fechaCorta(String(ultimaReserva.creado).slice(0, 10)) : '—') + '</div>' +
      '</div>' +
      (Object.keys(procs).length ? '<div class="fila"><span>Procedimientos realizados</span>' + Object.keys(procs).map(function(k){ return esc(k) + (procs[k] > 1 ? ' ×' + procs[k] : ''); }).join(' · ') + '</div>' : '') +
      '<div style="margin-top:12px">' + suyas.map(function(x){
        var f = x.fecha_cita || x.fecha_solicitada;
        return '<div class="hist-item"><b>' + esc(x.servicio) + '</b> · ' + (f ? fechaCorta(f) : '—') + ' ' + chipEstado(x.estado, x) +
          '<small>' + esc(x.categoria) + (x.largo ? ' · largo ' + esc(x.largo) : '') + ' · ' + esc(x.id) + '</small></div>';
      }).join('') + '</div>' +
      '<p class="nota">Se agrupa por el mismo celular o correo. Las reservas eliminadas no aparecen.</p>' +
      '<div class="acciones"><button class="btn sec" onclick="cerrarModal()">Cerrar</button></div>';
    document.getElementById('modal').classList.add('abierto');
  }

  /** Vista previa del día elegido con la cita propuesta encima de lo que ya hay en Calendar. */
  function pintarPrevia(id){
    var caja = document.getElementById('pv-' + id); if (!caja) return;
    var f = document.getElementById('fe-' + id).value, hi = document.getElementById('hi-' + id).value, hf = document.getElementById('hf-' + id).value;
    document.getElementById('cg-' + id).innerHTML = f ? textoCarga(f) : '';
    if (!f) { caja.innerHTML = ''; return; }
    if (!asegurarAgenda(f, f, function(){ pintarPrevia(id); })) { caja.innerHTML = '<p class="nota">Leyendo el calendario…</p>'; return; }
    var evs = (CACHE[f] || []).filter(function(e){ return e.reserva !== id; });
    var prop = hi && hf && horas(hf) > horas(hi) ? { ini: hi, fin: hf } : null;
    ajustarHoras(evs.concat(prop ? [prop] : []));
    var cerrado = DIAS_CERRADOS.indexOf(fechaD(f).getDay()) >= 0;
    caja.innerHTML = '<div class="previa"><div class="titulo">' + fechaCorta(f) + ' · ' + evs.filter(function(e){ return !e.todoElDia; }).length +
      ' en calendario' + (cerrado ? ' · día cerrado' : '') + '</div>' + gutter() + columna(f, evs, prop) + '</div>';
  }

  // ---------------------------------------------------------------- acciones: al instante en pantalla, guardado de fondo
  /**
   * Aplica el cambio en pantalla de inmediato y lo manda al servidor en una cola (una acción a la vez,
   * para que nunca se pisen). Si el servidor falla, se avisa y se recarga el panel con los datos reales.
   */
  function accion(id, fn, args, cambios, textoYa, textoListo, avisa){
    var r = reservaPorId(id); if (!r) return;
    Object.keys(cambios).forEach(function(k){ r[k] = cambios[k]; });
    if ((r.estado === 'cita_agendada' || r.estado === 'cita_confirmada') && cambios.fecha_cita) ponerEvento(r);
    else if (cambios.estado === 'cita_confirmada') estadoEvento(id, 'cita_confirmada');
    else if (cambios.estado === 'dia_saturado' || cambios.estado === 'cancelada' || cambios.estado === 'pago_por_validar' || cambios.estado === 'requiere_aprobacion') quitarEventos(id);
    else if (cambios.estado) estadoEvento(id, cambios.estado);
    pintar();
    aviso(textoYa);
    COLA.push({ id: id, fn: fn, args: args, textoListo: textoListo, avisa: avisa });
    procesarCola();
  }
  /** Texto según por dónde salió el aviso a la clienta ('correo+whatsapp', 'correo', 'whatsapp' o ''). */
  function textoAviso(canales, r){
    if (canales === false) return { t: 'Guardado, pero el correo a la clienta NO salió. Revisa EmailJS.', error: true };
    if (!canales) return { t: 'Guardado, pero no salió ningún aviso automático. Escríbele con el botón WhatsApp.', error: true };
    var partes = canales.split('+');
    var t = 'Guardado ✓ Aviso enviado por ' + partes.join(' y ') + '.';
    if (partes.indexOf('whatsapp') < 0 && r && r.celular) t += DATOS.whatsappApi ? ' El WhatsApp no salió: usa el botón WhatsApp.' : ' (WhatsApp automático aún no conectado: usa el botón WhatsApp.)';
    return { t: t, error: false };
  }
  function procesarCola(){
    pintarSync();
    if (OCUPADO || !COLA.length) return;
    OCUPADO = true;
    var t = COLA.shift();
    var run = google.script.run
      .withSuccessHandler(function(res){
        var r = reservaPorId(t.id);
        if (r && res && res.reserva) Object.keys(res.reserva).forEach(function(k){ r[k] = res.reserva[k]; });
        if (t.nueva && res && res.reserva) { DATOS.reservas.unshift(res.reserva); r = res.reserva; if (r.fecha_cita) ponerEvento(r); }
        if (res && res.modos) DATOS.modos = res.modos;                    // bloquearDia
        if (res && res.limiteHoras) DATOS.ajustes = res;                     // guardarAjustes
        OCUPADO = false;
        if (t.avisa && res && 'correo' in res && res.correo !== null) { var a = textoAviso(res.correo, r); aviso(a.t, a.error); }
        else if (res && res.correo === false) aviso('Guardado, pero el correo a la clienta NO salió. Revisa EmailJS.', true);
        else if (t.textoListo) aviso(t.textoListo);
        if (t.recargar) { CACHE = {}; }
        if (!editando() && !COLA.length) pintar();
        procesarCola();
      })
      .withFailureHandler(function(e){
        OCUPADO = false;
        COLA = [];
        aviso('No se pudo guardar: ' + e.message + '. Se recargaron los datos reales.', true);
        cargar();
        pintarSync();
      });
    run[t.fn].apply(run, t.args);
  }
  function pintarSync(){
    var s = document.getElementById('sync'), n = COLA.length + (OCUPADO ? 1 : 0);
    s.textContent = n ? 'Guardando…' : '';
    s.className = n ? 'guardando' : '';
  }
  window.addEventListener('beforeunload', function(e){ if (COLA.length || OCUPADO) { e.preventDefault(); e.returnValue = ''; } });

  /** Paso 1 de eliminar: ventana de confirmación (evita borrar por un mal clic). */
  function pedirEliminar(id){
    var r = reservaPorId(id); if (!r) return;
    document.getElementById('hoja').innerHTML =
      '<span class="chip bad">Eliminar reserva</span><h3>' + esc(r.nombre) + '</h3>' +
      '<div class="fila"><span>Reserva</span>' + esc(r.servicio) + ' · ' + esc(r.id) + '</div>' +
      '<div class="alerta">Se quita del panel' + (r.evento_id || r.fecha_cita ? ' y de Google Calendar' : '') + ', y libera su espacio. ' +
        '<b>El registro se conserva en la hoja de reservas</b> (marcado como eliminada), con su comprobante. No se envía ningún correo a la clienta.</div>' +
      '<div class="acciones"><button class="btn bad" onclick="eliminar(\'' + id + '\')">Sí, eliminar</button>' +
      '<button class="btn sec" onclick="cerrarModal()">Cancelar</button></div>';
    document.getElementById('modal').classList.add('abierto');
  }
  /** Paso 2: desaparece al instante; el servidor la borra de fondo. */
  function eliminar(id){
    cerrarModal();
    DATOS.reservas = DATOS.reservas.filter(function(r){ return r.id !== id; });
    quitarEventos(id);
    pintar();
    aviso('Reserva eliminada.');
    COLA.push({ id: id, fn: 'eliminarReserva', args: [id], textoListo: 'Quitada del panel. El registro queda guardado en la hoja ✓' });
    procesarCola();
  }

  // ---------------------------------------------------------------- mover entre pestañas
  var NOMBRE_TAB = { requiere_aprobacion: 'Requiere aprobación', por_agendar: 'Por agendar', cita_confirmada: 'Confirmadas', historial: 'Historial' };

  /** Qué se puede hacer al llevar una reserva a una pestaña. Cada opción dice si envía correo. */
  function opcionesMover(r, tab){
    var id = r.id, o = [], e = r.estado;
    function op(texto, nota, fn, clase){ o.push({ texto: texto, nota: nota, fn: fn, clase: clase || '' }); }
    if (tab === 'por_agendar') {
      if (e === 'requiere_aprobacion') op('Aprobar y agendar', 'Se agenda a la hora que pidió y se le envía la confirmación (WhatsApp y correo).', function(){ aprobarRes(id); }, 'ok');
      if (e === 'pago_por_validar') op('Aprobar pago', 'Se le envía el correo "pago confirmado".', function(){ aprobar(id); });
      if (e === 'cita_confirmada' && !porRevisar(r)) op('Cambiar fecha u hora', 'Abre el formulario para moverla.', function(){ irAReserva(id); abrir(id); }, 'sec');
    }
    if (tab === 'cita_confirmada') {
      if (porRevisar(r)) op('Horario correcto', 'Pasa a Confirmadas sin cambiar nada. Sin aviso.', function(){ revisada(id); }, 'ok');
      if (e === 'requiere_aprobacion') op('Aprobar y agendar', 'Se agenda a la hora que pidió y se le envía la confirmación (WhatsApp y correo).', function(){ aprobarRes(id); }, 'ok');
      if (e === 'cita_agendada') op('Confirmar cita', 'Se le envía el correo "cita confirmada".', function(){ confirmar(id); }, 'ok');
      if (e === 'pago_aprobado' || e === 'dia_saturado') return { motivo: 'Primero ponle fecha y hora en "Por agendar" (Paso 1).' };
      if ((e === 'completada' || e === 'no_asistio') && r.fecha_cita) op('Volver a confirmadas', 'Sin correo.', function(){ cambiar(id, 'cita_confirmada'); }, 'sec');
    }
    if (tab === 'historial') {
      if (e === 'cita_confirmada' || e === 'cita_agendada' || e === 'no_asistio') op('Completada', 'La cita ya se realizó. Sin correo.', function(){ cambiar(id, 'completada'); }, 'ok');
      if (e === 'cita_confirmada' || e === 'cita_agendada' || e === 'completada') op('No asistió', 'Sin correo.', function(){ cambiar(id, 'no_asistio'); }, 'sec');
      if (e === 'pago_por_validar') op('Rechazar pago', 'Se le envía el correo "pago rechazado".', function(){ rechazar(id); }, 'bad');
      if (['pago_por_validar','pago_aprobado','dia_saturado','cita_agendada','cita_confirmada','requiere_aprobacion'].indexOf(e) >= 0)
        op('Cancelar reserva', 'Se quita del calendario y libera el espacio. Sin aviso: escríbele por WhatsApp si hace falta.', function(){ cambiar(id, 'cancelada'); }, 'sec');
    }
    if (tab === 'requiere_aprobacion') {
      if (e === 'pago_rechazado') op('Reabrir', 'Vuelve a revisión. Sin correo.', function(){ cambiar(id, 'pago_por_validar'); }, 'sec');
      if (e === 'cancelada' && r.origen === 'web') op('Reabrir', 'Vuelve a "Requiere aprobación". Sin aviso.', function(){ cambiar(id, 'requiere_aprobacion'); }, 'sec');
    }
    return { opciones: o };
  }

  function mostrarOpciones(r, grupos){
    var h = '<span class="chip">Mover reserva</span><h3>' + esc(r.nombre) + '</h3><div class="fila"><span>Ahora</span>' + chipEstado(r.estado, r) + '</div>';
    MOVER = [];
    grupos.forEach(function(g){
      h += '<div class="fila"><span>A ' + NOMBRE_TAB[g.tab] + '</span></div>';
      g.res.opciones.forEach(function(x){
        var n = MOVER.push(x.fn) - 1;
        h += '<div class="opcion"><button class="btn ' + x.clase + '" onclick="cerrarModal();MOVER[' + n + ']()">' + x.texto + '</button><small>' + x.nota + '</small></div>';
      });
    });
    h += '<div class="acciones"><button class="btn sec" onclick="cerrarModal()">Cancelar</button></div>';
    document.getElementById('hoja').innerHTML = h;
    document.getElementById('modal').classList.add('abierto');
  }
  var MOVER = [];

  /** Botón "Mover a…": todas las opciones posibles para esa reserva (útil en el celular). */
  function pedirMover(id){
    var r = reservaPorId(id); if (!r) return;
    var grupos = Object.keys(NOMBRE_TAB).map(function(t){ return { tab: t, res: opcionesMover(r, t) }; })
      .filter(function(g){ return g.res.opciones && g.res.opciones.length; });
    if (!grupos.length) return aviso('Esta reserva no tiene otros movimientos disponibles.', true);
    mostrarOpciones(r, grupos);
  }

  // Arrastrar una tarjeta (por la manija ⠿) y soltarla sobre una pestaña.
  function empezarArrastre(ev, id){
    ARRASTRANDO = id;
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('text/plain', id);
    var c = document.getElementById('c-' + id);
    if (c) { ev.dataTransfer.setDragImage(c, 20, 20); setTimeout(function(){ c.classList.add('arrastrando'); }, 0); }
    document.body.classList.add('modo-arrastre');
  }
  function terminarArrastre(){
    var c = ARRASTRANDO && document.getElementById('c-' + ARRASTRANDO);
    if (c) c.classList.remove('arrastrando');
    document.body.classList.remove('modo-arrastre');
    document.querySelectorAll('.tab.drop').forEach(function(t){ t.classList.remove('drop'); });
    ARRASTRANDO = null;
  }
  function sobreTab(ev, el){ if (!ARRASTRANDO) return; ev.preventDefault(); el.classList.add('drop'); }
  function soltarEnTab(ev, tab, el){
    ev.preventDefault();
    el.classList.remove('drop');
    var id = ARRASTRANDO || ev.dataTransfer.getData('text/plain');
    terminarArrastre();
    var r = reservaPorId(id); if (!r) return;
    if (enTab(r, tab)) return;
    var res = opcionesMover(r, tab);
    if (res.motivo) return aviso(res.motivo, true);
    if (!res.opciones.length) return aviso('No se puede mover a ' + NOMBRE_TAB[tab] + ' desde "' + chipTexto(r.estado) + '".', true);
    mostrarOpciones(r, [{ tab: tab, res: res }]);   // siempre se confirma, para evitar un mal arrastre
  }
  function chipTexto(e){ var d = document.createElement('div'); d.innerHTML = chipEstado(e); return d.textContent; }

  /** Cambios sin correo (completada, no asistió, cancelada, reabrir…). */
  function cambiar(id, nuevo){
    var textos = { completada: 'Marcada como completada ✓', no_asistio: 'Marcada como "no asistió"', cancelada: 'Reserva cancelada (sin correo)',
                   cita_confirmada: 'De vuelta en confirmadas', pago_por_validar: 'Reabierta', requiere_aprobacion: 'Reabierta en "Requiere aprobación"' };
    var cambios = { estado: nuevo };
    if (nuevo === 'cita_confirmada') cambios.revisada = 'sí';
    if (nuevo === 'cancelada' || nuevo === 'pago_por_validar' || nuevo === 'requiere_aprobacion') { cambios.evento_id = ''; cambios.fecha_cita = ''; cambios.hora_inicio = ''; cambios.hora_fin = ''; }
    accion(id, 'cambiarEstado', [id, nuevo], cambios, textos[nuevo] || 'Listo', 'Guardado ✓');
  }

  function aprobar(id){
    accion(id, 'aprobarPago', [id], { estado: 'pago_aprobado', motivo: '' }, 'Pago aprobado. Enviando correo…', 'Correo "pago confirmado" enviado ✓');
  }
  function rechazar(id){
    var motivo = prompt('Motivo del rechazo (se le envía a la clienta):', 'El monto o la descripción del SINPE no coinciden con la reserva.');
    if (motivo === null) return;
    accion(id, 'rechazarPago', [id, motivo], { estado: 'pago_rechazado', motivo: motivo }, 'Pago rechazado. Enviando correo…', 'Correo "pago rechazado" enviado ✓');
  }
  function saturado(id){
    if (!confirm('¿Marcar como día saturado? Se quita del calendario (si estaba) y se le envía el correo para coordinar otra fecha por WhatsApp.')) return;
    accion(id, 'marcarDiaSaturado', [id, ''], { estado: 'dia_saturado', evento_id: '', fecha_cita: '', hora_inicio: '', hora_fin: '' },
      'Marcada como día saturado. Enviando correo…', 'Correo "día saturado" enviado ✓');
  }
  function agendar(id){
    var f = document.getElementById('fe-' + id).value, hi = document.getElementById('hi-' + id).value, hf = document.getElementById('hf-' + id).value;
    if (!f || !hi || !hf) return aviso('Completa fecha, inicio y fin.', true);
    if (horas(hf) <= horas(hi)) return aviso('La hora de fin debe ser posterior a la de inicio.', true);
    document.activeElement && document.activeElement.blur();
    accion(id, 'agendarCita', [id, f, hi, hf], { estado: 'cita_agendada', fecha_cita: f, hora_inicio: hi, hora_fin: hf },
      'Puesta en el calendario. Revisa el día y confírmala.', 'Evento guardado en Google Calendar ✓');
  }
  function confirmar(id){
    accion(id, 'confirmarCita', [id], { estado: 'cita_confirmada' }, 'Cita confirmada. Enviando correo…', 'Correo "cita confirmada" enviado ✓');
  }

  /** "Requiere aprobación" → aprobar: se agenda a la hora pedida y se le confirma (WhatsApp + correo). */
  function aprobarRes(id){
    var r = reservaPorId(id); if (!r) return;
    var ini = r.hora_solicitada || (r.franja === 'Tarde' ? '13:00' : '09:00');
    accion(id, 'aprobarReserva', [id], { estado: 'cita_confirmada', revisada: '', fecha_cita: r.fecha_solicitada, hora_inicio: ini,
      hora_fin: sumarHoras(ini, Number(r.dur_max_h) || Number(r.dur_min_h) || 2) }, 'Aprobada y agendada. Enviando confirmación…', 'Confirmación enviada ✓', true);
  }
  function noAprobar(id){
    var r = reservaPorId(id); if (!r) return;
    document.getElementById('hoja').innerHTML = '<span class="chip bad">No aprobar</span><h3>' + esc(r.nombre) + '</h3>' +
      '<div class="alerta">La reserva pasa al historial como <b>cancelada</b> y libera su espacio. No se envía ningún aviso automático: ' +
      'escríbele por WhatsApp para ofrecerle otra fecha.</div>' +
      '<div class="acciones"><button class="btn bad" onclick="cerrarModal();cambiar(\'' + id + '\',\'cancelada\')">Sí, no aprobar</button>' +
      botonWhatsApp(r) + '<button class="btn sec" onclick="cerrarModal()">Volver</button></div>';
    document.getElementById('modal').classList.add('abierto');
  }
  /** Por agendar → Confirmadas sin cambios. */
  function revisada(id){
    accion(id, 'marcarRevisada', [id], { revisada: 'sí' }, 'Horario correcto: pasó a Confirmadas.', 'Guardado ✓');
  }
  /** Ajustar fecha/horario de una cita (duración real). Solo avisa si cambia la fecha o la hora de inicio. */
  function ajustar(id){
    var r = reservaPorId(id); if (!r) return;
    var f = document.getElementById('fe-' + id).value, hi = document.getElementById('hi-' + id).value, hf = document.getElementById('hf-' + id).value;
    if (!f || !hi || !hf) return aviso('Completa fecha, inicio y fin.', true);
    if (horas(hf) <= horas(hi)) return aviso('La hora de fin debe ser posterior a la de inicio.', true);
    var avisa = !r.evento_id || r.fecha_cita !== f || r.hora_inicio !== hi;
    document.activeElement && document.activeElement.blur();
    accion(id, 'ajustarHorario', [id, f, hi, hf], { estado: 'cita_confirmada', revisada: 'sí', fecha_cita: f, hora_inicio: hi, hora_fin: hf },
      avisa ? 'Horario cambiado. Avisando a la clienta…' : 'Duración ajustada (sin aviso a la clienta).', 'Guardado en Google Calendar ✓', avisa);
  }

  // ---------------------------------------------------------------- cita manual
  function catalogo(){ return window.AMARE_SERVICES || []; }
  function opcionesCat(){
    var cats = []; catalogo().forEach(function(x){ if (cats.indexOf(x.categoria) < 0) cats.push(x.categoria); });
    return cats;
  }
  function pedirCitaManual(fecha){
    var hoy = DATOS.hoy || isoDe(new Date());
    var hayCat = catalogo().length > 0;
    document.getElementById('hoja').className = 'hoja ancha form-panel';

        (hayCat
          ? '<div><label>Categoría</label><select id="cm-cat" onchange="cmCat()"><option value="">Elige…</option>' + opcionesCat().map(function(c){ return '<option>' + esc(c) + '</option>'; }).join('') + '</select></div>' +
            '<div><label>Servicio</label><select id="cm-svc" onchange="cmSvc()"><option value="">Elige la categoría</option></select></div>' +
            '<div><label>Largo</label><select id="cm-largo" onchange="cmLargo()"><option value="">—</option></select></div>'
          : '<div><label>Servicio</label><input id="cm-svc-txt" placeholder="Ej. Balayage"></div>') +
      '</div><div class="campos">' +
        '<div><label>Fecha</label><input type="date" id="cm-fecha" value="' + (fecha || hoy) + '" oninput="cmCarga()"></div>' +
        '<div><label>Hora de inicio</label><input type="time" id="cm-hi" value="09:00" step="900"></div>' +

      '</div><div id="cm-carga"></div>' +
      '<div class="campos">' +
        '<div><label>Nombre <small>(opcional)</small></label><input id="cm-nombre" placeholder="Nombre de la clienta"></div>' +
        '<div><label>Celular <small>(opcional)</small></label><input id="cm-cel" inputmode="tel" placeholder="8888-8888"></div>' +

      '<label class="check"><input type="checkbox" id="cm-mail"> Enviar confirmación por correo</label>' +
      '<p class="nota">La cita bloquea su espacio en Google Calendar, queda en la base de datos y recibe los recordatorios de 3 días y 1 día antes (si tiene celular o correo).</p>' +
      '<div class="acciones"><button class="btn" onclick="crearManual()">Agregar cita</button><button class="btn sec" onclick="cerrarModal()">Cancelar</button></div>';
    document.getElementById('modal').classList.add('abierto');
    cmCarga();
  }
  function cmServicio(){
    var cat = document.getElementById('cm-cat'), svc = document.getElementById('cm-svc');
    if (!cat || !svc || svc.value === '') return null;
    return catalogo().filter(function(x){ return x.categoria === cat.value; })[Number(svc.value)] || null;
  }
  function cmCat(){
    var cat = document.getElementById('cm-cat').value;
    var lista = catalogo().filter(function(x){ return x.categoria === cat; });
    document.getElementById('cm-svc').innerHTML = '<option value="">Elige…</option>' + lista.map(function(x, i){ return '<option value="' + i + '">' + esc(x.servicio) + '</option>'; }).join('');
    document.getElementById('cm-largo').innerHTML = '<option value="">—</option>';
  }
  function cmSvc(){
    var s = cmServicio();
    document.getElementById('cm-largo').innerHTML = s ? Object.keys(s.tiers).map(function(l){ return '<option>' + esc(l) + '</option>'; }).join('') : '<option value="">—</option>';
    if (s && s.horas && s.horas.length) document.getElementById('cm-hi').value = String(s.horas[0]).padStart(2, '0') + ':00';
    cmLargo();
  }
  function cmLargo(){
    var s = cmServicio(); if (!s) return;
    var t = s.tiers[document.getElementById('cm-largo').value];
    if (t) document.getElementById('cm-dur').value = Number(t.durMax) || Number(t.durMin) || 2;
  }
  function cmCarga(){
    var f = document.getElementById('cm-fecha').value, c = document.getElementById('cm-carga');
    if (c) c.innerHTML = f ? textoCarga(f) : '';
  }
  function crearManual(){
    var v = function(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; };
    var s = cmServicio(), largo = v('cm-largo'), t = s && s.tiers[largo];
    var servicio = s ? s.servicio : v('cm-svc-txt');
    if (!servicio) return aviso('Elige el servicio.', true);
    var f = v('cm-fecha'), hi = v('cm-hi'), dur = Number(v('cm-dur'));
    if (!f || !hi) return aviso('Completa la fecha y la hora de inicio.', true);
    if (!(dur > 0)) return aviso('La duración debe ser mayor que cero.', true);
    var correo = v('cm-correo');
    if (correo && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo)) return aviso('El correo no es válido.', true);
    var datos = {
      categoria: s ? s.categoria : '', servicio: servicio, codigo: s ? s.codigo : '', largo: t ? largo : '',
      precio_min: t ? t.min : 0, precio_max: t ? t.max : 0, dur_min_h: t ? t.durMin : dur, dur_max_h: dur,
      nombre: v('cm-nombre'), celular: v('cm-cel'), correo: correo, comentarios: v('cm-notas'),
      fecha: f, horaInicio: hi, horaFin: sumarHoras(hi, dur),
      enviarWhatsapp: document.getElementById('cm-wa').checked && !!v('cm-cel'),
      enviarCorreo: document.getElementById('cm-mail').checked && !!correo
    };
    cerrarModal();
    aviso('Creando la cita…');
    COLA.push({ fn: 'crearCitaManual', args: [datos], nueva: true, avisa: datos.enviarWhatsapp || datos.enviarCorreo, textoListo: 'Cita agregada al calendario ✓' });
    procesarCola();
  }

  // ---------------------------------------------------------------- espacio bloqueado
  function pedirBloqueo(fecha){
    var hoy = DATOS.hoy || isoDe(new Date());
    document.getElementById('hoja').className = 'hoja form-panel';
    document.getElementById('hoja').innerHTML = '<span class="chip">Espacio bloqueado</span><h3>Bloquear un espacio</h3>' +
      '<p class="nota">Para vacaciones, ausencias, viajes o eventos. No se envía ningún mensaje; solo tú lo ves y la web deja de ofrecer ese espacio.</p>' +
      '<label class="check" style="margin-top:10px"><input type="checkbox" id="bq-dia" checked onchange="document.getElementById(\'bq-horas\').style.display=this.checked?\'none\':\'flex\';document.getElementById(\'bq-hasta-c\').style.display=this.checked?\'block\':\'none\'"> Todo el día</label>' +
      '<div class="campos">' +
        '<div><label>Fecha</label><input type="date" id="bq-fecha" value="' + (fecha || hoy) + '"></div>' +
        '<div id="bq-hasta-c"><label>Hasta <small>(opcional)</small></label><input type="date" id="bq-hasta"></div>' +
      '</div>' +
      '<div class="campos" id="bq-horas" style="display:none">' +
        '<div><label>Desde</label><input type="time" id="bq-hi" value="09:00" step="900"></div>' +
        '<div><label>Hasta</label><input type="time" id="bq-hf" value="12:00" step="900"></div>' +
      '</div>' +
      '<label>Motivo <small>(opcional, solo lo ves tú)</small></label><input id="bq-motivo" style="width:100%" placeholder="Ej. Vacaciones">' +
      '<div class="acciones"><button class="btn" onclick="crearBloqueoPanel()">Bloquear</button><button class="btn sec" onclick="cerrarModal()">Cancelar</button></div>';
    document.getElementById('modal').classList.add('abierto');
  }
  function crearBloqueoPanel(){
    var todo = document.getElementById('bq-dia').checked;
    var f = document.getElementById('bq-fecha').value, hasta = document.getElementById('bq-hasta').value;
    var hi = document.getElementById('bq-hi').value, hf = document.getElementById('bq-hf').value, motivo = document.getElementById('bq-motivo').value.trim();
    if (!f) return aviso('Elige la fecha.', true);
    if (!todo && (!hi || !hf || horas(hf) <= horas(hi))) return aviso('Revisa las horas: el fin debe ser después del inicio.', true);
    if (todo && hasta && hasta < f) return aviso('La fecha "hasta" debe ser igual o posterior.', true);
    cerrarModal();
    aviso('Bloqueando el espacio…');
    COLA.push({ fn: 'crearBloqueo', args: [f, todo ? '' : hi, todo ? '' : hf, motivo, todo ? hasta : ''], recargar: true, textoListo: 'Espacio bloqueado ✓' });
    procesarCola();
  }
  function quitarBloqueoPanel(eventoId){
    if (!confirm('¿Quitar este espacio bloqueado? La web vuelve a ofrecer ese espacio si hay cupo.')) return;
    cerrarModal();
    Object.keys(CACHE).forEach(function(f){ CACHE[f] = CACHE[f].filter(function(e){ return e.id !== eventoId; }); });
    pintar();
    COLA.push({ fn: 'quitarBloqueo', args: [eventoId], textoListo: 'Bloqueo quitado ✓' });
    procesarCola();
  }

  function cargar(){
    google.script.run.withSuccessHandler(recibir)
      .withFailureHandler(function(e){ document.getElementById('lista').innerHTML = '<p class="vacio">' + esc(e.message) + '</p>'; })
      .panelDatos();
  }
  // La agenda se refresca sola cada minuto (solo en esa pestaña y sin acciones pendientes).
  setInterval(function(){ if (TAB === 'agenda' && !document.hidden && !COLA.length && !OCUPADO) cargar(); }, 60000);
  // Los encabezados de los días se quedan pegados justo debajo del header (su alto cambia en el celular).
  function medirHeader(){ document.documentElement.style.setProperty('--cab', document.querySelector('header').offsetHeight + 'px'); }
  window.addEventListener('resize', medirHeader); medirHeader();
  cargar();
</script>
</body>
</html>
